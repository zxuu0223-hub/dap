<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive resume upload step reproduced from the supplied Figma design.">
  <title>Finish! Upload Your Resume</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Finish!</p>
      <h1 id="page-title">Upload Your Resume</h1>
      <p class="lede">Upload your resume, the platform will help you parse and optimize your profile.</p>

      <svg class="illustration" viewBox="0 0 520 360" role="img" aria-label="Friendly blue character holding a resume card">
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1956b8" flood-opacity=".16"/>
          </filter>
        </defs>
        <path d="M70 284c-18-47 15-82 52-72 25 7 37 35 23 57-11 18-38 22-55 8" fill="none" stroke="#1f6cf0" stroke-width="26" stroke-linecap="round"/>
        <path d="M151 319c5-80 57-129 126-120 58 7 93 52 94 120" fill="#2878f5"/>
        <path d="M203 223c19-22 45-28 69-11 22 16 29 45 14 70" fill="#76a8ff"/>
        <ellipse cx="225" cy="237" rx="7" ry="10" fill="#173364"/>
        <ellipse cx="260" cy="235" rx="7" ry="10" fill="#173364"/>
        <path d="M230 264c12 7 26 6 36-4" fill="none" stroke="#173364" stroke-width="5" stroke-linecap="round"/>
        <rect x="251" y="67" width="177" height="232" rx="16" fill="#fff" filter="url(#shadow)" transform="rotate(-5 339 183)"/>
        <rect x="278" y="102" width="82" height="12" rx="6" fill="#1f6cf0" transform="rotate(-5 319 108)"/>
        <rect x="276" y="130" width="119" height="8" rx="4" fill="#dce8fb" transform="rotate(-5 335 134)"/>
        <rect x="274" y="151" width="105" height="8" rx="4" fill="#dce8fb" transform="rotate(-5 327 155)"/>
        <circle cx="318" cy="208" r="30" fill="#ecf4ff"/>
        <path d="M307 211l8 8 17-20" fill="none" stroke="#1f6cf0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M186 286c37-1 68 11 91 34" fill="none" stroke="#104eb9" stroke-width="13" stroke-linecap="round"/>
        <rect x="281" y="254" width="123" height="65" rx="14" fill="#27354c"/>
        <circle cx="312" cy="285" r="7" fill="#fff"/><circle cx="342" cy="285" r="7" fill="#fff"/><circle cx="372" cy="285" r="7" fill="#fff"/>
      </svg>
    </section>

    <section class="upload-card" aria-labelledby="upload-heading">
      <h2 id="upload-heading">Upload file</h2>
      <label class="drop-zone" id="drop-zone" for="resume-input" tabindex="0">
        <input id="resume-input" type="file" accept=".pdf,.doc,.docx" hidden>
        <span class="cloud" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 8.5 4.8 4.8 0 0 0 7 18Zm5-8v6m0-6-2.4 2.4M12 10l2.4 2.4"/></svg>
        </span>
        <strong id="drop-title">Drag your resume to this area</strong>
        <span id="drop-help">or click to browse · PDF, DOC, DOCX · up to 10 MB</span>
      </label>

      <div class="file-state" id="file-state" hidden aria-live="polite">
        <div class="file-icon" aria-hidden="true">CV</div>
        <div class="file-copy">
          <strong id="file-name"></strong>
          <span id="file-size"></span>
        </div>
        <button class="remove" id="remove-file" type="button" aria-label="Remove selected file">×</button>
      </div>
      <p class="error" id="error-message" role="alert"></p>

      <div class="actions">
        <button class="button secondary" type="button" id="previous">Last step</button>
        <button class="button primary" type="button" id="finish" disabled>Finish</button>
      </div>

      <ol class="progress" aria-label="Application progress">
        <li class="complete"><span>1</span><small>Profile</small></li>
        <li class="complete"><span>2</span><small>Details</small></li>
        <li class="active"><span>3</span><small>Resume</small></li>
      </ol>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
